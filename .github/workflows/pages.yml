name: GitHub Pages

# 安全审计:
# - 触发条件: push 到 main/miao + workflow_dispatch(无 payload)
# - 不用 github.event.* / pull_request.* 等用户控制字段
# - 不用 github.event.client_payload.* (防 attacker 设任意字段)
# - 所有 build 步骤是确定性的(不读 commit message 等)
# - 部署是 GitHub-controlled(无注入风险)

on:
  push:
    branches: [main, miao]
  workflow_dispatch:  # 允许手动触发(无 payload)

permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          mkdir -p _site

          # 1. 复制 docs(根 + 各种子目录)
          cp -r docs _site/docs

          # 2. 生成 index.html(从 INDEX.md 转换)
          # 因为 INDEX.md 已经是 markdown,我们直接展示它
          if command -v pandoc >/dev/null 2>&1; then
            pandoc INDEX.md -o _site/index.html --standalone \
              --metadata title="kallax-experts" \
              --template=template.html 2>/dev/null || cp INDEX.md _site/
          else
            # 兜底: 直接复制 markdown
            cp INDEX.md _site/
          fi

          # 3. 复制 experts .md
          mkdir -p _site/experts
          cp -r experts/* _site/experts/ 2>/dev/null || true

          # 4. 生成可搜索的 index(experts 列表)
          cat > _site/experts/_index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>kallax-experts - Browse</title>
            <style>
              body { font-family: system-ui; max-width: 900px; margin: 2em auto; padding: 0 1em; }
              h1 { color: #333; }
              input { width: 100%; padding: 0.5em; font-size: 1.1em; border: 1px solid #ddd; border-radius: 4px; }
              .expert { padding: 0.5em; border-bottom: 1px solid #eee; }
              .expert:hover { background: #f5f5f5; }
              .meta { color: #888; font-size: 0.9em; }
              pre { background: #f5f5f5; padding: 0.5em; border-radius: 4px; overflow-x: auto; }
              code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
            </style>
          </head>
          <body>
            <h1>🎯 kallax-experts / Browse</h1>
            <p>本地 15 个 expert,可搜索。</p>
            <input type="search" id="search" placeholder="搜索关键词,如:安全, API, LLM..." autofocus>
            <div id="results"></div>
            <script>
              const experts = [];
            </script>
          EOF

          # 收集 expert 元数据
          for f in $(find experts -name "*.md" -type f | sort); do
            name=$(grep -E "^name:" "$f" | head -1 | sed -E 's/name:[[:space:]]*//')
            role_id=$(grep -E "^role_id:" "$f" | head -1 | sed -E 's/role_id:[[:space:]]*//')
            emoji=$(grep -E "^emoji:" "$f" | head -1 | sed -E 's/emoji:[[:space:]]*//' | tr -d '"')
            vibes=$(grep -E "^vibe:" "$f" | head -1 | sed -E 's/vibe:[[:space:]]*//')
            triggers=$(grep -A20 "^triggers:" "$f" | grep -E "^  (zh|en):" | head -2 | sed -E 's/.*:[[:space:]]*//' | tr -d '[]' | tr ',' ' ' | xargs)
            divisions=$(grep -E "^divisions:" "$f" | head -1 | sed -E 's/divisions:[[:space:]]*//' | tr -d '[]' | tr ',' ' ')
            source=$(grep -E "^source:" "$f" | head -1 | sed -E 's/source:[[:space:]]*//')

            # 计算 relative path
            rel_path="experts/$(echo "$f" | sed 's|^experts/||')"

            cat >> _site/experts/_index.html <<EOF
              experts.push({
                name: $(echo "$name" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
                role_id: "$role_id",
                emoji: "$emoji",
                vibe: $(echo "$vibes" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
                triggers: $(echo "$triggers" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
                divisions: $(echo "$divisions" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
                source: "$source",
                path: "$rel_path"
              });
            EOF
          done

          # 完成 JS
          cat >> _site/experts/_index.html <<'EOF'
              const html = experts.map(e => `
                <div class="expert" data-name="${e.name.toLowerCase()}" data-triggers="${e.triggers.toLowerCase()}" data-division="${e.divisions.toLowerCase()}">
                  <strong>${e.emoji} ${e.name}</strong> <code>${e.role_id}</code>
                  <div class="meta">${e.vibe}</div>
                  <div class="meta">📁 ${e.source} · ${e.divisions || 'n/a'}</div>
                  <div class="meta">🔑 ${e.triggers}</div>
                  <a href="${e.path}">View prompt →</a>
                </div>
              `).join('');
              document.getElementById('results').innerHTML = html;

              document.getElementById('search').addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                document.querySelectorAll('.expert').forEach(el => {
                  const match = (el.dataset.name + ' ' + el.dataset.triggers + ' ' + el.dataset.division).includes(q);
                  el.style.display = match ? 'block' : 'none';
                });
              });
            </script>
          </body>
          </html>
          EOF

          echo "Build complete: $(ls _site | wc -l) entries"
          ls _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4